services:
  influxdb3-enterprise:
    image: influxdb:3-enterprise
    ports:
      - 8181:8181
    networks:
      - influxdb-net
    command:
      - influxdb3
      - serve
      - --node-id=node0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --plugin-dir=/var/lib/influxdb3/plugins
      - --cluster-id=cluster0
      - --license-email=${INFLUXDB3_LICENSE_EMAIL}
      - --license-type=${INFLUXDB3_LICENSE_TYPE}
    environment:
      - INFLUXDB3_LICENSE_EMAIL=${INFLUXDB3_LICENSE_EMAIL}
      - INFLUXDB3_LICENSE_TYPE=${INFLUXDB3_LICENSE_TYPE}
    volumes:
      - type: bind
        source: ./influxdb3/data
        target: /var/lib/influxdb3/data
      - type: bind
        source: ./influxdb3/plugins
        target: /var/lib/influxdb3/plugins
    extra_hosts:
      - "host.docker.internal:host-gateway"

  explorer:
    image: influxdata/influxdb3-ui:1.8.0
    container_name: influxdb3-explorer
    pull_policy: always
    command:
      - --mode=admin
    ports:
      - 8888:8080
    volumes:
      - type: bind
        source: ./influxdb3-ui/db
        target: /db
      - type: bind
        source: ./influxdb3-ui/config
        target: /app-root/config
        read_only: true
      - type: bind
        source: ./influxdb3-ui/ssl
        target: /etc/nginx/ssl
        read_only: true
    environment:
      SESSION_SECRET_KEY: ${EXPLORER_SESSION_SECRET_KEY}
    restart: unless-stopped
    networks:
      - influxdb-net

  telegraf:
      container_name: telegraf
      build: .
      networks:
        - influxdb-net
      volumes:
        - type: bind
          source: ./telegraf
          target: /etc/telegraf
          read_only: true
      environment:
        KAFKA_BROKER: ${KAFKA_BROKER}
        INFLUXDB3_TOKEN: ${INFLUXDB3_TOKEN}
        SQL_DB_CONN: ${SQL_DB_CONN}
        ALARIK_ACCESS_KEY: ${ALARIK_ACCESS_KEY}
        ALARIK_SECRET_KEY: ${ALARIK_SECRET_KEY}
        ALARIK_ENDPOINT: "alarik:8080"
      depends_on:
        - influxdb3-enterprise

  alarik:
    image: ghcr.io/achtungsoftware/alarik:latest
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - API_BASE_URL=http://localhost:8081
      - CONSOLE_BASE_URL=http://localhost:3000
      - ADMIN_USERNAME=${ALARIK_ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ALARIK_ADMIN_PASSWORD}
      - JWT=${ALARIK_JWT_SECRET}
      - ALLOW_ACCOUNT_CREATION=false
    volumes:
      - type: bind
        source: ./alarik/data
        target: /app/Storage
    networks:
      - influxdb-net

  console:
    image: ghcr.io/achtungsoftware/alarik-console:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NUXT_PUBLIC_API_BASE_URL=http://localhost:8081
      - NUXT_PUBLIC_CONSOLE_BASE_URL=http://localhost:3000
      - NUXT_PUBLIC_ALLOW_ACCOUNT_CREATION=false
    depends_on:
      - alarik
    networks:
      - influxdb-net

networks:
  influxdb-net:
    driver: bridge